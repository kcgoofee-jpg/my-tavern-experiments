<style>
  /* 每层界面配色取自《天城视觉规范》：上层夜墨琥珀、中层夜紫霓虹（唯一允许发光）、下层井黑磷光绿（等宽字） */
  body[data-map="tc_upper"], body[data-map="eden_estate"] { --bg: #101418; --panel: rgba(16,20,24,.92); --gold: #d9a441; --muted: #7d8a96; --ink: #cfd8e0; }
  body[data-map="tc_mid"] { --bg: #120a1f; --panel: rgba(18,10,31,.9); --gold: #ff3d9a; --muted: #a99bc0; --ink: #f3e6ff; }
  body[data-map="tc_mid"] #crumbs b, body[data-map="tc_mid"] #layers button.on { text-shadow: -1px 0 #3de0ff, 1px 0 #ff3d9a, 0 0 10px rgba(255,61,154,.7); }
  body[data-map="tc_mid"] #prog i { box-shadow: 0 0 8px #ff3d9a; }
  body[data-map="tc_low"] { --bg: #0b0b0b; --panel: rgba(11,11,11,.92); --gold: #9fe870; --muted: #5a8a3c; --ink: #d8e8cc; }
  body[data-map="tc_low"] #crumbs, body[data-map="tc_low"] #layers, body[data-map="tc_low"] #tierState { font-family: ui-monospace, Menlo, monospace; }
  header, #layers button, #card { transition: background .3s, color .3s, border-color .3s; }
  /* 档位旁的加载状态：切换清晰度后看得到有没有在加载、加载完了没有 */
  #tierState { font-size: 12px; color: var(--muted); min-width: 5.5em; white-space: nowrap; }
  #tierState.busy { color: var(--gold); }
  #tierState.ok { color: var(--ok); }
  #tierState.stuck { color: var(--bad); cursor: pointer; text-decoration: underline; }
  :root { --bg: #14171c; --panel: rgba(20,23,28,.88); --line: rgba(255,255,255,.14); --ink: #eef1f4; --muted: #9aa3ad; --gold: #e6c36a; --inf: #ffb347; }
  :root { --on-gold: #1a1406; --field: rgba(255,255,255,.06); --hover: rgba(255,255,255,.08); --track: rgba(255,255,255,.08); --src: #c9d1d9; --ok: #7bd88f; --bad: #ff7a7a; }
  /* 浅色主题：取《天城视觉规范》的浅色变量（纸面 #f6f7f5、墨 #14171a、金 #8f6f2e）；每层保留自己的强调色，换成在浅底上读得清的深一档 */
  html.light { --bg: #e9ebe8; --panel: rgba(246,247,245,.94); --line: rgba(20,23,26,.16); --ink: #14171a; --muted: #5d666b; --gold: #8f6f2e; --inf: #b06000;
    --on-gold: #fff; --field: rgba(20,23,26,.05); --hover: rgba(20,23,26,.06); --track: rgba(20,23,26,.1); --src: #3b4247; --ok: #2e8b4a; --bad: #c0392b; }
  html.light body[data-map="tc_upper"], html.light body[data-map="eden_estate"] { --bg: #efeae0; --panel: rgba(246,243,236,.94); --gold: #8f6f2e; --muted: #6b665c; --ink: #1b1a17; }
  html.light body[data-map="tc_mid"] { --bg: #f1ecf7; --panel: rgba(247,244,251,.94); --gold: #b3155f; --muted: #6d5a86; --ink: #1d1230; }
  html.light body[data-map="tc_low"] { --bg: #f4f1e8; --panel: rgba(244,241,232,.95); --gold: #3f7a22; --muted: #5a6b4c; --ink: #1b2414; }
  html.light body[data-map="tc_mid"] #crumbs b, html.light body[data-map="tc_mid"] #layers button.on { text-shadow: none; }
  html.light body[data-map="tc_mid"] #prog i { box-shadow: none; }
  html.light #status { color: rgba(255,255,255,.8); }
  #langSeg button { padding: 6px 9px; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 15px; margin: 0 10px 0 0; letter-spacing: 2px; }
  .seg { flex: none; display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { white-space: nowrap; }
  .seg button, .btn { background: transparent; color: var(--ink); border: 0; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--gold); color: var(--on-gold); font-weight: 700; }
  .btn { border: 1px solid var(--line); border-radius: 8px; }
  label.tg { font-size: 13px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  .where { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  .where input { background: var(--field); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; padding: 5px 8px; width: 150px; font: inherit; }
  #stage { position: relative; min-height: 0; }
  #osd { position: absolute; inset: 0; }
  /* 面包屑：世界 › 天城 · 上层 */
  #crumbs { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-right: 8px; white-space: nowrap; }
  #crumbs a { color: var(--gold); cursor: pointer; text-decoration: none; }
  #crumbs a:hover { text-decoration: underline; }
  #crumbs .sep { color: var(--muted); }
  #crumbs b { font-weight: 700; }
  /* 同组多层切换器（天城上 / 中 / 下层）：左侧竖排，像电梯按钮 */
  #layers { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; gap: 6px; }
  #layers[hidden], .tg[hidden] { display: none; }
  #layers button { min-width: 92px; white-space: nowrap; transition: border-color .15s, background .15s, transform .08s; text-align: left; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; line-height: 1.3; }
  #layers button small { display: block; font-size: 11px; color: var(--muted); }
  #layers button:not(:disabled):hover { border-color: rgba(230,195,106,.7); }
  #layers button:not(:disabled):active { transform: scale(.96); }
  /* 站内跳转链接（进入某层、跨层通道）没有 href，要手动给手指光标和点击反馈 */
  [data-go] { cursor: pointer; user-select: none; }
  #card a[data-go], #crumbs a { transition: opacity .1s; }
  #card a[data-go]:hover, #crumbs a:hover { text-decoration: underline; }
  #card a[data-go]:active, #crumbs a:active { opacity: .6; }
  .seg button { transition: background .15s; }
  .seg button:not(.on):hover { background: var(--hover); }
  .seg button:active { opacity: .7; }
  #layers button.on { border-color: var(--gold); box-shadow: inset 3px 0 0 var(--gold); }
  /* 层按钮上的标记：红点 = 当前地点在这一层；数字 = 这一层未解除的事态数 */
  #layers .hd { display: none; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: #ff5a5a; box-shadow: 0 0 6px rgba(255,90,90,.8); vertical-align: 1px; }
  #layers button.here .hd { display: inline-block; }
  #layers .evn { display: inline-block; margin-left: 5px; min-width: 15px; height: 15px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #e0182d; color: #fff; font: 700 10px/15px "PingFang SC", sans-serif; font-style: normal; text-align: center; vertical-align: 1px; text-shadow: none; }
  #layers .evn:empty { display: none; }
  /* 庄园剖面（kind=estate）：三维页面放在 iframe 里盖住瓦片地图；切换时淡入淡出，不闪 */
  #estate { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 5; background: transparent; opacity: 0; transition: opacity .2s; }
  #estate.on { opacity: 1; }
  body.estate #tiers, body.estate #tierState, body.estate header .tg, body.estate #evbar, body.estate #glitchNote, body.estate #status { display: none; }
  /* 切层淡入：旧底图的截图盖在上面，新底图画出第一张瓦片后淡出（≤ 220 ms） */
  .snap { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; transition: opacity .22s; }
  .snap.out { opacity: 0; }
  #layers button:disabled { opacity: .45; cursor: default; }
  /* 加载进度：顶部细条 + 首屏居中提示 */
  #prog { position: absolute; left: 0; right: 0; top: 0; height: 4px; z-index: 7; background: var(--track); }
  #prog[hidden] { display: none; }
  #prog i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .2s; }
  #loading { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: var(--bg); color: var(--muted); font-size: 14px; transition: opacity .3s; }
  #loading.done { opacity: 0; pointer-events: none; }
  /* 第一张图块画出来后：遮罩变透明、进度变成浮动卡片，直到 100% 才淡出（不论快慢都看得到进度） */
  #loading.over { background: transparent; pointer-events: none; }
  #loading.over span { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; color: var(--ink); text-shadow: none; }
  /* 世界图首屏：瓦片还没到时先铺一张 1200px 缩略图（压暗 + 模糊），不再是一片黑 */
  #loading.thumb { background: linear-gradient(rgba(10,12,16,.55), rgba(10,12,16,.55)), url(art/world_1k.jpg) center / cover; color: #eef1f4; text-shadow: 0 1px 4px #000; }
  .barriers :is(ellipse, path) { fill: rgba(120,220,255,.06); stroke: rgba(140,230,255,.75); stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .barriers .eden { stroke: var(--gold); stroke-width: 2; fill: rgba(230,195,106,.08); }
  .barriers.proj :is(ellipse, path) { fill: rgba(0,0,0,.12); stroke: rgba(190,205,230,.5); stroke-width: 1; stroke-dasharray: 5 4; }
  .barriers.proj .eden { stroke: rgba(230,195,106,.7); fill: rgba(0,0,0,.12); }
  /* 标记 */
  .mk { position: relative; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; cursor: pointer; user-select: none; }
  /* OSD 会给叠加层写内联 display:block，flex 居中失效，所以针脚自己居中 */
  .mk .pin { margin: 0 auto; width: 14px; height: 14px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #4dabf7; border: 2px solid #fff; box-shadow: 0 1px 4px #000a; }
  .mk .lab { width: max-content; margin: 0 auto 4px; padding: 2px 8px; border-radius: 10px; background: rgba(12,14,18,.78); border: 1px solid rgba(255,255,255,.25); font-size: 12px; white-space: nowrap; color: #fff; }
  .mk.capital .pin { background: var(--gold); width: 16px; height: 16px; }
  .mk.capital .lab { font-size: 14px; font-weight: 800; border-color: var(--gold); }
  .mk.inf .pin { background: var(--inf); }
  .mk.inf .lab { color: #ffd9a8; }
  .mk.drill .lab { background: rgba(230,195,106,.92); color: #1a1406; font-weight: 800; }
  .mk.here .pin { background: #ff5a5a; }
  .mk.here::after { content: ''; position: absolute; bottom: -6px; left: 50%; width: 22px; height: 22px; margin-left: -13px; border-radius: 50%; border: 2px solid #ff5a5a; animation: pulse 1.4s infinite; will-change: transform, opacity; }
  .mk.active .lab { outline: 2px solid var(--gold); }
  @keyframes pulse { 0% { transform: scale(.4); opacity: .9; } 100% { transform: scale(1.8); opacity: 0; } }
  .realm { transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; text-align: center; white-space: nowrap; color: #fff;
    text-shadow: 0 0 6px #000, 0 0 3px #000, 0 2px 8px #000c; }
  /* 字号随地图实际显示比例缩放（--rs = 屏幕像素 / 地图单位 × 1600 / 1100） */
  .realm b { display: block; font-size: clamp(13px, calc(30px * var(--rs, 1)), 40px); letter-spacing: calc(12px * min(var(--rs, 1), 1)); font-weight: 900; }
  .realm span { font-size: clamp(10px, calc(13px * var(--rs, 1)), 15px); letter-spacing: 2px; opacity: .9; }
  body.tiny .realm span, body.tiny .minor { display: none; }
  html[lang="en"] .realm b { letter-spacing: calc(3px * min(var(--rs, 1), 1)); }   /* 拉丁字母不能用中文的大字距 */
  html[lang="en"] .realm span { letter-spacing: .5px; }
  .realm.oren b { font-family: "PingFang SC", sans-serif; color: #ffe2a8; }
  .realm.fed b { font-family: "Songti SC", "STSong", serif; color: #cfe3ff; }
  .realm.xl b { font-family: "Kaiti SC", "STKaiti", serif; color: #e6d6ff; }
  .minor { transform: translate(-50%, -50%); font-size: 12px; color: #fff; opacity: .8; text-shadow: 0 0 4px #000, 0 0 2px #000; white-space: nowrap; }
  body.nolabels .realm, body.nolabels .minor { display: none; }
  body.nomarkers .mk { display: none; }
  body.embed .where { display: none; }
  body.far .mk:not(.capital):not(.here):not(.active) .lab { display: none; }
  body.far .mk:not(.active) .lab small { display: none; }
  /* 信息卡 */
  #card { position: fixed; right: 14px; top: calc(var(--hdr, 50px) + 14px); width: 320px; max-width: calc(100vw - 28px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.65; z-index: 10; }
  #card[hidden] { display: none; }
  /* 设置（⚙）：浮在工具栏下方的小面板；放在 header 外面，手机上工具栏横向滚动时不被裁掉 */
  #setPop { position: fixed; right: 12px; top: calc(var(--hdr, 50px) + 6px); z-index: 11; width: 260px; max-width: calc(100vw - 32px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  #setPop[hidden] { display: none; }
  #setPop label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  #setPop input { margin: 3px 0 0; flex: none; width: 16px; height: 16px; }
  #setPop small { display: block; color: var(--muted); font-size: 11.5px; margin: 2px 0 0 24px; }
  #setBtn { padding: 6px 10px; }
  #setBtn[aria-expanded="true"] { border-color: var(--gold); color: var(--gold); }
  #card .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: #2f6f4f; color: #fff; }
  #card .tag.inf { background: #b06000; }
  #card h2 { margin: 6px 0 4px; font-size: 17px; }
  #card .src { color: var(--src); white-space: pre-line; }
  #card .src[data-note]::before { content: attr(data-note); display: block; font-size: 11px; color: var(--muted); }
  #card .x { position: absolute; right: 8px; top: 6px; background: none; border: 0; color: var(--muted); font-size: 18px; cursor: pointer; }
  #card a { color: var(--gold); }
  /* 窄屏：工具栏压缩成一行可横向滑动，信息卡改为底部抽屉 */
  @media (max-width: 640px) {
    header { flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding: 6px 8px; scrollbar-width: none; }
    header::-webkit-scrollbar { display: none; }
    .where { display: none; }
    #crumbs { font-size: 13px; flex: none; }
    /* 手机：一列紧凑小按钮，只显示层名 */
    #layers { left: 6px; top: auto; bottom: 30px; transform: none; gap: 4px; }
    #layers button { min-width: 0; padding: 4px 7px; font-size: 12px; }
    #layers button small { display: none; }
    .seg button { padding: 7px 10px; }
    label.tg { flex: none; font-size: 12px; }
    label.tg input { width: 16px; height: 16px; margin: 0; }
    #card { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-width: none; max-height: 45%; overflow-y: auto; border-radius: 12px 12px 0 0; padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    #card .x { font-size: 24px; padding: 4px 8px; }
    .mk .lab { font-size: 11px; }
    #status { display: none; }
  }
  #credit { position: absolute; right: 8px; top: 6px; z-index: 4; font-size: 10px; color: rgba(255,255,255,.55); text-shadow: 0 0 3px #000; pointer-events: none; }
  #credit:empty { display: none; }
  #build { position: absolute; left: 6px; bottom: 6px; z-index: 4; font: 10px/1.4 ui-monospace, Menlo, monospace; color: rgba(255,255,255,.4); background: none; border: 0; padding: 2px 4px; cursor: pointer; }
  #build:hover { color: rgba(255,255,255,.85); }
  #build:active { transform: translateY(1px); }
  #build:empty { display: none; }
  #status { position: fixed; left: 14px; bottom: 12px; font-size: 12px; color: var(--muted); z-index: 5; text-shadow: 0 0 3px #000; }
</style>

<body>
<div id="app">
  <header>
    <nav id="crumbs"></nav>
    <div class="seg" id="tiers"></div><span id="tierState" aria-live="polite"></span>
    <label class="tg" id="tgOverlay"><input type="checkbox" id="tgBorders" checked><span>国界</span></label>
    <label class="tg" id="tgAlt" hidden data-i18n-title="alt_title" title="高级：换成带下方城市的底图（图更大）"><input type="checkbox" id="tgAltBox"><span>显示下方城市</span></label>
    <label class="tg"><input type="checkbox" id="tgLabels" checked><span data-i18n="labels">地名</span></label>
    <label class="tg"><input type="checkbox" id="tgMarkers" checked><span data-i18n="markers">标记</span></label>
    <div class="seg" id="langSeg" data-i18n-title="lang_title" title="界面语言"><button type="button" data-lang="zh">中</button><button type="button" data-lang="en">EN</button></div>
    <button type="button" class="btn" id="themeBtn" data-i18n-title="theme_title" title="界面主题"></button>
    <button type="button" class="btn" id="setBtn" data-i18n-title="settings_title" title="设置" aria-expanded="false" aria-controls="setPop">⚙</button>
    <div class="where"><span data-i18n="here">当前地点</span> <input id="here" data-i18n-ph="here_ph" placeholder="模拟 MVU：世界.当前地点" value="旷野高地"></div>
  </header>
  <div id="stage"><div id="osd"></div><div id="credit"></div><button id="build" data-i18n-title="build_title" title="版本编码，点击复制诊断信息"></button><nav id="layers" hidden></nav><div id="prog" hidden><i></i></div><div id="loading"><span data-i18n="loading">加载中…</span></div></div>
</div>
<div id="setPop" hidden role="dialog"><label><input type="checkbox" id="optAutoHere" checked><span data-i18n="auto_here">打开地图时自动跳到当前地点</span></label><small data-i18n="auto_here_hint">庄园房间直达对应楼层；地标、层、世界地名各自落到对应的图</small></div>
<div id="card" hidden><button class="x" id="cardX">×</button><span class="tag"></span><h2></h2><div class="src"></div><div class="extra"></div></div>

<script>

  slowStop = false;

  if (userMoved || !viewer || !viewer.world.getItemCount()) return;
  const m = REG.maps[cur], cs = viewer.viewport.getContainerSize();
  // 同组切层：沿用上一层的视野（跨层通道 link 带 pendingFocus 时仍然聚焦到目标地点）
  const gv = m.group && m.kind === 'points' && groupView[m.group];
  const home = pendingHome; pendingHome = false;
  if (gv && immediately && !pendingFocus && !home) { viewer.viewport.fitBounds(gv, true); userMoved = true; return; }
  let nx, ny, w;
  if (m.kind === 'world') {
    const el = document.querySelector('.mk.here') || [...document.querySelectorAll('.mk')].find(e => e.dataset.name === '天城');
    const p = el && M.places.find(q => q.name === el.dataset.name) || M.fiefs.find(q => q.name === el?.dataset.name) || M.places.find(q => q.id === m.view?.focus) || M.places[0];
    [nx, ny] = toImg(p.x, p.y); w = .34;
  } else {
    const here = document.querySelector('.mk.here')?.dataset.name, mk = curData?.markers || [];
    const id = pendingFocus || Object.entries(m.markers || {}).find(([, v]) => v.name === here)?.[0] || m.view?.focus || m.focus;
    const k = mk.find(q => q.id === id) || { nx: .5, ny: .5 }; nx = k.nx; ny = k.ny; w = .3;
  }
  // view：初始可见宽度按米给（每张图自己的尺度）；竖屏时让可见「高度」等于这个宽度，手机上不会一打开就缩得很小
  const vw = viewNorm(m, 'width_m');
  if (vw) w = cs.y > cs.x ? vw * cs.x / cs.y : vw;
  w = Math.min(w, aspect * .8 * cs.x / cs.y); const h = w * cs.y / cs.x;   // 竖屏时按高度收窄，避免视框比地图还高
  viewer.viewport.fitBounds(new OpenSeadragon.Rect(nx - w / 2, ny * aspect - h / 2, w, h), immediately);
}
// 当前地点高亮（由 MVU 变量「世界.当前地点」驱动）；世界图上，庄园与天城内部的地点都归到「天城」
const ALIAS = { '天城': ['天城', '伊甸', '庄园', '书房', '主卧', '大厅', '餐厅', '会客厅', '客房', '寝', '浴室', '后庭', '前庭', '上层', '中层', '下层', '钢铁霓虹', '地基', '公寓', '银冠堡'] };
function markHere(v) {
  v = (v || '').replace('{{user}}', '');
  // 解析出的落点也算：庄园里的任何地方 → 上层的「伊甸庄园」标记与世界图的「天城」；天城任一层 → 「天城」；地标 → 该标记
  const r = hereRes(v), tcLayers = REG?.groups?.tiancheng?.layers || [], m = cur && REG.maps[cur];
  const extra = new Set();
  if (r) {
    if (tcLayers.includes(r.map)) extra.add('天城');
    for (const k of Object.values(m?.markers || {})) if (k.link?.map === r.map && REG.maps[r.map]?.kind === 'estate') extra.add(k.name);
    if (r.marker && r.map === cur) extra.add(m.markers?.[r.marker]?.name);
    if (r.place) extra.add(r.place);
  }
  document.querySelectorAll('.mk').forEach(e => { const n = e.dataset.name, al = e.dataset.alias ? e.dataset.alias.split('|') : ALIAS[n] || [];
    const hit = !!v && (extra.has(n) || v.includes(n) || n.includes(v) || al.some(k => v.includes(k)));
    e.classList.toggle('here', hit); });
  updateLayerBadges(); estateRoom();
}
// ---------------- 自动跳到当前地点（map/here.mjs 六级落点；设置里可关，默认开） ----------------
// 庄园房间 / 区域 → 庄园（房间由 estate:room 高亮，切楼层由庄园页自己做）；地标 → 该层并打开地点卡；层 / 大区 / 天城 → 该层默认视野；世界地名 → 世界图；匹配不到不动。
// 打开面板（或唤醒）后的第一条地点一定跳；之后只有地点变了才跳，不打断用户自己在别的图上浏览。
let HX = null, hereIdx = null, lastJump = null, hereFresh = true;
const AUTO_KEY = 'edenMapAutoHere';
const autoHere = () => { try { return localStorage.getItem(AUTO_KEY) !== '0'; } catch (e) { return true; } };
const hereRes = v => (HX && hereIdx ? HX.resolveHere(v, hereIdx) : null);
function jumpHere(v, force) {
  const r = hereRes(v);
  if (!r || !autoHere() || !REG?.maps[r.map] || REG.maps[r.map].status === 'planned') return false;
  if (!force && v === lastJump) return false;
  lastJump = v;
  if (r.map !== cur) { pendingFocus = r.marker || null; pendingHome = !r.marker && !r.place; go(r.map); return true; }
  if ((r.marker || r.place) && viewer?.world.getItemCount()) { userMoved = false; markHere(v); focusStart(false); }   // 同一张图：飞到地标 / 世界地名
  return true;
}
function initSettings() {
  const btn = $('#setBtn'), pop = $('#setPop'), box = $('#optAutoHere');
  box.checked = autoHere();
  box.onchange = () => { try { localStorage.setItem(AUTO_KEY, box.checked ? '1' : '0'); } catch (e) {} if (box.checked) jumpHere($('#here').value, true); };
  const show = on => { pop.hidden = !on; btn.setAttribute('aria-expanded', on ? 'true' : 'false'); };
  btn.onclick = e => { e.stopPropagation(); show(pop.hidden); };
  document.addEventListener('click', e => { if (!pop.hidden && !pop.contains(e.target) && e.target !== btn) show(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') show(false); });
}
// 嵌入酒馆（悬浮按钮面板）的消息接口：
//   酒馆 → 地图：eden-map:here {value}（当前地点）、eden-map:open {map}（直接打开某张地图）
//   地图 → 酒馆：eden-map:ready（可以撤掉加载遮罩）、eden-map:state {map, title}（当前地图，用于面板标题）
if (window.top !== window) {
  document.body.classList.add('embed');
  window.addEventListener('message', e => {
    if (e.data?.type === 'eden-map:here') { $('#here').value = e.data.value || ''; markHere(e.data.value); if (!jumpHere(e.data.value || '', hereFresh)) focusStart(false); hereFresh = false; }
    if (e.data?.type === 'eden-map:open') go(e.data.map);
    if (e.data?.type === 'eden-map:events') TCEvents.set(e.data);   // 卡内脚本从聊天里解析、合并好的事态 {items, floor, fly}
    // 面板关闭时休眠：关掉底图（释放已解码的瓦片），脚本与数据留着；再打开时唤醒，重新打开当前地图
    if (e.data?.type === 'eden-map:sleep' && viewer) { saveView(); sleeping = cur; cur = null; est?.frame.remove(); est = null; document.body.classList.remove('estate'); viewer.close(); viewer.clearOverlays(); setTimeout(() => { if (sleeping) slowWarmAlt(); }, 3000); }
    if (e.data?.type === 'eden-map:wake' && sleeping) { slowStop = true; const id = sleeping; sleeping = null; hereFresh = true; go(id); }
  });
}
main();
</script>
