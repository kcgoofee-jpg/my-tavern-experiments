<style>

  .mk.capital .pin { background: var(--gold); width: 16px; height: 16px; }

    text-shadow: 0 0 6px #000, 0 0 3px #000, 0 2px 8px #000c; }

  body.tiny .realm span, body.tiny .minor { display: none; }

  body.nolabels .realm, body.nolabels .minor { display: none; }

  /* 信息卡 */

  @media (max-width: 640px) {

  #credit:empty { display: none; }
  #status { position: fixed; left: 14px; bottom: 12px; font-size: 12px; color: var(--muted); z-index: 5; text-shadow: 0 0 3px #000; }

<body>
<div id="app">
  <header>
    <nav id="crumbs"></nav>
    <div class="seg" id="tiers"></div><span id="tierState" aria-live="polite"></span>
    <label class="tg" id="tgOverlay"><input type="checkbox" id="tgBorders" checked><span>国界</span></label>
    <label class="tg" id="tgAlt" hidden title="高级：换成带下方城市的底图（图更大）"><input type="checkbox" id="tgAltBox"><span>显示下方城市</span></label>
    <label class="tg"><input type="checkbox" id="tgLabels" checked>地名</label>
    <label class="tg"><input type="checkbox" id="tgMarkers" checked>标记</label>
    <div class="where">当前地点 <input id="here" placeholder="模拟 MVU：世界.当前地点" value="旷野高地"></div>
  </header>
  <div id="stage"><div id="osd"></div><div id="credit"></div><nav id="layers" hidden></nav><div id="prog" hidden><i></i></div><div id="loading"><span>加载中…</span></div></div>
</div>
<div id="card" hidden><button class="x" id="cardX">×</button><span class="tag"></span><h2></h2><div class="src"></div><div class="extra"></div></div>
<div id="status">加载中…</div>
<script>
// 多地图查看器：地图注册表 data/maps.json（世界 → 天城三层 → 以后的庄园剖面……）。
// 底图都是 DZI 瓦片金字塔，只加载屏幕里看得见的部分；解码内存由屏幕大小和瓦片缓存上限决定。
// 档位 = 清晰度上限：最多加载到相当于 cap 像素宽的那一层瓦片（放大后差别明显），默认省流。
const TIERS = [
  { key: 'save', name: '省流', cap: 2000, ratio: 1, dpr: 1.25 },
  { key: 'std', name: '标准', cap: 4000, ratio: .8, dpr: 2 },
  { key: 'hd', name: '清晰', cap: 8000, ratio: .5, dpr: 3 },
];
const TIER_KEY = 'edenMapTierV2';   // 换了键名：旧版存下的「标准」不再沿用，统一从省流开始
// 世界图：代码地图坐标（1600×1000）→ 底图归一化坐标（相机裁切：宽 98.5%、高 97%）
const toImg = (x, y) => [(x / 1600 - .0075) / .985, (y / 1000 - .015) / .97];

let viewer, aspect = 1, M, REG, cur = null, curData = null, ovData = null, tier = 'save', sleeping = null, pendingFocus = null;
try { tier = localStorage.getItem(TIER_KEY) || 'save'; } catch (e) {}
if (!TIERS.some(t => t.key === tier)) tier = 'save';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let narrow = false;
// 触屏或低内存设备：瓦片缓存减半（约 30 MB），避免手机 WebView 因内存被回收
const coarse = matchMedia('(pointer: coarse)').matches || (navigator.deviceMemory || 8) <= 4;   // 手机 / 窄面板：隐藏小地图（信息卡的底部抽屉由 CSS 媒体查询处理）
const post = msg => { if (window.top !== window) parent.postMessage(msg, '*'); };
// 数据文件只取一次：切换地图、面板休眠后唤醒都不再重复请求
const jsonCache = new Map();
const getJSON = url => { if (!jsonCache.has(url)) jsonCache.set(url, fetch(url).then(r => r.ok ? r.json() : null).catch(() => null)); return jsonCache.get(url); };

async function main() {
  // 三个启动文件并行取（之前 derived.json 要等前两个取完才开始）
  let d;
  [REG, M, d] = await Promise.all([getJSON('data/maps.json'), getJSON('data/world_markers.json'), getJSON('data/derived.json')]);
  post({ type: 'eden-map:boot', pct: .9 });   // 数据文件已到
  // Blender 地形重新生成后，「旷野高地」取新地形在奥伦境内的最高点
  if (d?.highland) Object.assign(M.places.find(p => p.id === 'highland'), d.highland);
  // 世界图上，天城各层地图里的地点（执法局、7 号井……）都归到「天城」
  for (const k of REG.groups.tiancheng?.layers || []) for (const v of Object.values(REG.maps[k].markers || {})) ALIAS['天城'].push(...(v.alias || []));
  narrow = innerWidth <= 640;   // 等 iframe 布局完成后再判断，脚本刚执行时宽度可能还是 0
  const seg = $('#tiers');
  for (const t of TIERS) { const b = document.createElement('button'); b.textContent = t.name; b.dataset.k = t.key;
    b.onclick = () => setTier(t.key); seg.appendChild(b); }
  // 画布像素密度随档位封顶：高分屏（手机 3x）上省流只画 1.25x，填充的像素少一半以上，选瓦片的层级也跟着降
  const devDpr = OpenSeadragon.getCurrentPixelDensityRatio;
  OpenSeadragon.getCurrentPixelDensityRatio = () => Math.min(devDpr(), TIERS.find(t => t.key === tier).dpr);
  OpenSeadragon.pixelDensityRatio = OpenSeadragon.getCurrentPixelDensityRatio();
  viewer = OpenSeadragon({
    element: $('#osd'), drawer: 'canvas', prefixUrl: 'vendor/openseadragon/images/',
    showNavigator: !narrow, showFullPageControl: false, navigatorPosition: 'BOTTOM_RIGHT', visibilityRatio: 1, constrainDuringPan: true, homeFillsViewer: true, minZoomImageRatio: 1,
    maxZoomPixelRatio: 2.5, crossOriginPolicy: 'Anonymous', animationTime: .6, blendTime: 0, immediateRender: false, imageLoaderLimit: 16, maxImageCacheCount: coarse ? 30 : 60,   /* 512px 瓦片：并发拉取，缓存约 60 MB */ minPixelRatio: TIERS.find(t => t.key === tier).ratio, gestureSettingsMouse: { clickToZoom: false, dblClickToZoom: true }, gestureSettingsTouch: { pinchRotate: false, flickEnabled: true },
    smoothTileEdgesMinZoom: Infinity,   // 瓦片有 1px 重叠，不需要放大时整屏再画一遍去接缝
  });
  viewer.addHandler('open', onOpen);
  viewer.addHandler('open-failed', e => { $('#loading span').textContent = '地图加载失败：' + (e.message || ''); });
  viewer.addHandler('canvas-drag', () => userMoved = true); viewer.addHandler('canvas-scroll', () => userMoved = true); viewer.addHandler('canvas-pinch', () => userMoved = true);
  let lastRs = 0, queued = false;
  const rescale = () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false;
    if (!viewer.world.getItemCount()) return;
    const px = viewer.viewport.getContainerSize().x * viewer.viewport.getZoom(true);   // 整张图的屏幕宽度
    const rs = px / 1100; if (Math.abs(rs - lastRs) / (lastRs || 1) < .04) return; lastRs = rs;
    document.documentElement.style.setProperty('--rs', rs.toFixed(3));
    document.body.classList.toggle('far', px < 1700); document.body.classList.toggle('tiny', px < 800); }); };
  viewer.addHandler('animation', rescale); viewer.addHandler('resize', rescale); viewer.addHandler('open', () => setTimeout(rescale, 0));
  initProgress();
  $('#tgBorders').onchange = applyOverlayToggle;
  $('#tgAltBox').onchange = e => { try { localStorage.setItem(ALT_KEY + cur, e.target.checked ? '1' : '0'); } catch (err) {} swapBase(); };
  $('#tgLabels').onchange = e => document.body.classList.toggle('nolabels', !e.target.checked);
  $('#tgMarkers').onchange = e => document.body.classList.toggle('nomarkers', !e.target.checked);
  $('#here').oninput = () => markHere($('#here').value);
  $('#cardX').onclick = closeCard;
  const q = new URLSearchParams(location.search).get('map');
  go(REG.maps[q] && REG.maps[q].status !== 'planned' ? q : REG.start);
  post({ type: 'eden-map:ready' });
  // 首张地图画出来后，空闲时预热其他地图：描述文件、点位数据、最粗的几层瓦片（切过去立刻有模糊版）
  viewer.addOnceHandler('tile-drawn', () => setTimeout(warmOthers, 1500));
}
// 面板收起（休眠）时的慢速预取：把另一版底图（如上层「显示下方城市」）按当前清晰度上限一张一张取进缓存，
// 每张间隔 250ms、同时只取 1 张，不和聊天抢带宽；面板打开就停，下次收起从没取过的继续
let slowStop = true;
const slowDone = new Set();
async function slowWarmAlt() {
  slowStop = false;
  for (const m of Object.values(REG.maps)) {
    if (!m.alt?.base || m.status === 'planned') continue;
    try {
      const x = await getText(m.alt.base);
      const T = +x.match(/TileSize="(\d+)"/)[1], f = x.match(/Format="(\w+)"/)[1];
      const W = +x.match(/Width="(\d+)"/)[1], H = +x.match(/Height="(\d+)"/)[1], top = Math.ceil(Math.log2(Math.max(W, H)));
      const cap = TIERS.find(t => t.key === tier).cap, maxL = Math.min(top, Math.ceil(Math.log2(W * Math.min(1, cap / W))));
      const dir = m.alt.base.replace(/\.dzi$/, '_files/');
      for (let L = 8; L <= maxL; L++) {
        const s2 = 2 ** (top - L), w = Math.ceil(W / s2), h = Math.ceil(H / s2);
        for (let c = 0; c < Math.ceil(w / T); c++) for (let r = 0; r < Math.ceil(h / T); r++) {
          const url = `${dir}${L}/${c}_${r}.${f}`;
          if (slowDone.has(url)) continue;
          if (slowStop) return;
          await new Promise(res => { const img = new Image(); img.crossOrigin = 'anonymous'; img.onload = img.onerror = res; img.src = url; });
          slowDone.add(url);
          await new Promise(res => setTimeout(res, 250));
        }
      }
    } catch (e) {}
  }
}
const textCache = new Map();
const getText = url => { if (!textCache.has(url)) textCache.set(url, fetch(url).then(r => r.text())); return textCache.get(url); };
async function warmOthers() {
  for (const [id, m] of Object.entries(REG.maps)) {
    if (id === cur || m.status === 'planned' || !m.base) continue;
    if (m.data) getJSON(m.data);
    try {
      const x = await fetch(m.base).then(r => r.text());
      const T = +x.match(/TileSize="(\d+)"/)[1], f = x.match(/Format="(\w+)"/)[1];
      const W = +x.match(/Width="(\d+)"/)[1], H = +x.match(/Height="(\d+)"/)[1], top = Math.ceil(Math.log2(Math.max(W, H)));
      const dir = m.base.replace(/\.dzi$/, '_files/');
      for (let L = 8; L <= Math.min(top, 10); L++) {                 // 最粗几层：总共几张瓦片
        const s = 2 ** (top - L), w = Math.ceil(W / s), h = Math.ceil(H / s);
        for (let c = 0; c < Math.ceil(w / T); c++) for (let r = 0; r < Math.ceil(h / T); r++) {
          const img = new Image(); img.crossOrigin = 'anonymous'; img.src = `${dir}${L}/${c}_${r}.${f}`;   // 与 OSD 的跨域方式一致，才能命中缓存
        }
      }
    } catch (e) {}
  }
}

// ---------------- 地图切换 ----------------
// alt：同一张图的另一版底图（上层默认云海，开关后显示下方城市）。只换底图，视角、标记、叠加层都不动；开关状态按地图记住
const ALT_KEY = 'edenMapAlt:';
const altOn = id => { try { return localStorage.getItem(ALT_KEY + id) === '1'; } catch (e) { return false; } };
const baseOf = id => { const m = REG.maps[id]; return m.alt && altOn(id) ? m.alt.base : m.base; };
function swapBase() {
  const id = cur, old = viewer.world.getItemAt(0); if (!old) return;
  viewer.addTiledImage({ tileSource: baseOf(id), index: 0, success: () => { if (cur !== id) return; viewer.world.removeItem(old); setTier(tier); },
    error: () => { try { localStorage.removeItem(ALT_KEY + id); } catch (e) {} $('#tgAltBox').checked = false; $('#tierState').textContent = '这版底图还没渲染'; } });
}
async function go(id) {
  const m = REG.maps[id]; if (!m || m.status === 'planned' || id === cur) return;
  cur = id; userMoved = false; closeCard(); document.body.dataset.map = id;
  // 叠加层可以取别的地图的数据（overlay.from），例如中层的「上层投影」用上层的岛屿轮廓
  const ovSrc = m.overlay?.from && REG.maps[m.overlay.from]?.data;
  const [cd, od] = await Promise.all([m.data ? getJSON(m.data) : null, ovSrc ? getJSON(ovSrc) : null]);
  if (id !== cur) return;   // 加载期间又切换了地图
  curData = cd; ovData = ovSrc ? od : cd;
  renderNav();
  $('#tgOverlay span').textContent = m.overlay?.label || '叠加层'; $('#tgOverlay').hidden = !m.overlay;
  $('#tgAlt').hidden = !m.alt; if (m.alt) { $('#tgAlt span').textContent = m.alt.label || '另一版底图'; $('#tgAltBox').checked = altOn(id); }
  $('#credit').textContent = m.credit || '';
  $('#loading').classList.remove('done', 'over'); $('#loading').classList.toggle('thumb', id === 'world'); $('#loading span').textContent = `加载 ${m.title}…`;
  const srcs = [{ tileSource: baseOf(id) }];
  if (m.overlay?.type === 'dzi') srcs.push({ tileSource: m.overlay.src, opacity: $('#tgBorders').checked ? 1 : 0 });
  viewer.open(srcs);
  post({ type: 'eden-map:state', map: id, title: m.title });
}
function renderNav() {
  const m = REG.maps[cur], chain = [];
  for (let k = cur; k; k = REG.maps[k].parent) chain.unshift(k);
  $('#crumbs').innerHTML = chain.map((k, i) => { const t = REG.maps[k].title;
    return i < chain.length - 1 ? `<a data-go="${k}">${esc(t)}</a><span class="sep">›</span>` : `<b>${esc(t)}</b>`; }).join('');
  const g = m.group && REG.groups[m.group], nav = $('#layers');
  nav.hidden = !g;
  if (g) nav.innerHTML = g.layers.map(k => { const L = REG.maps[k], planned = L.status === 'planned';
    return `<button data-go="${k}" class="${k === cur ? 'on' : ''}" ${planned ? 'disabled title="制作中"' : ''}>${esc(L.layer.name)}<small>${esc(planned ? '制作中' : L.layer.alt)}</small></button>`; }).join('');
}
document.addEventListener('click', e => { const a = e.target.closest('[data-go]'); if (a && !a.disabled) { e.preventDefault(); pendingFocus = a.dataset.focus || null; go(a.dataset.go); } });

// ---------------- 加载进度：已完成 / (已完成 + 正在加载) ----------------
function initProgress() {
  let done = 0, hideT = 0, tsT = 0, firstLoaded = false;
  const ts = $('#tierState');
  const upd = () => {
    let busy = 0; for (let i = 0; i < viewer.world.getItemCount(); i++) busy += viewer.world.getItemAt(i)._tilesLoading || 0;
    const pct = busy ? Math.round(done / (done + busy) * 100) : 100;
    $('#prog').hidden = !busy; $('#prog i').style.width = pct + '%';
    if (!$('#loading').classList.contains('done')) $('#loading span').textContent = `加载 ${REG.maps[cur].title} ${pct}%`;
    if (!firstLoaded) post({ type: 'eden-map:progress', pct });
    if (busy) { clearTimeout(tsT); ts.textContent = `加载中 ${pct}%`; ts.className = 'busy'; }
    else if (ts.className === 'busy') { ts.textContent = '✓ 已加载'; ts.className = 'ok'; clearTimeout(tsT); tsT = setTimeout(() => { ts.textContent = ''; ts.className = ''; }, 2500); }
    // 当前地图首屏瓦片都到了：告诉酒馆（后台预加载据此收尾）
    if (!busy && done && !firstLoaded) { firstLoaded = true; post({ type: 'eden-map:loaded' }); }
    clearTimeout(hideT); if (!busy) { if (done) setTimeout(() => $('#loading').classList.add('done'), 350); /* 在 100% 停一下再淡出 */ hideT = setTimeout(() => { done = 0; $('#prog').hidden = true; }, 200); }
  };
  viewer.addHandler('open', () => { done = 0; upd(); });
  viewer.addHandler('tile-loaded', () => { done++; lastTile = Date.now(); upd(); });
  // 卡住提示：还有图块在加载，但 8 秒没有新图块到达 → 网络慢；20 秒 → 可点击重试（重新请求当前地图的图块）
  let lastTile = Date.now();
  setInterval(() => {
    let busy = 0; for (let i = 0; i < viewer.world.getItemCount(); i++) busy += viewer.world.getItemAt(i)._tilesLoading || 0;
    const idle = (Date.now() - lastTile) / 1000;
    if (!busy) { lastTile = Date.now(); return; }
    if (idle > 20) { ts.textContent = '卡住了？点此重试'; ts.className = 'busy stuck'; }
    else if (idle > 8 && !ts.classList.contains('stuck')) { ts.textContent = `网络较慢… ${ts.textContent.match(/\d+%/)?.[0] || ''}`; }
  }, 1000);
  ts.addEventListener('click', () => { if (!ts.classList.contains('stuck')) return; ts.className = 'busy'; lastTile = Date.now();
    viewer.world.resetItems(); for (let i = 0; i < viewer.world.getItemCount(); i++) viewer.world.getItemAt(i)._needsUpdate = true; viewer.forceRedraw(); });
  viewer.addHandler('tile-load-failed', () => { done++; upd(); });
  viewer.addHandler('update-viewport', () => { if (!$('#prog').hidden || viewer.world.getItemAt(0)?._tilesLoading) upd(); });
  // 首屏：第一张瓦片画出来就撤掉遮罩（模糊版先出，随后变清晰）
  viewer.addHandler('tile-drawn', () => $('#loading').classList.add('over'));
}

// ---------------- 清晰度上限 ----------------
// 不能改 source.maxLevel（OSD 会按它重算每层比例，请求不存在的瓦片），所以包一层选层函数（OSD 5.0.1 内部方法，已随仓库固定版本）。
function capLevels(it) {
  if (it._capWrapped) return; it._capWrapped = true;
  const orig = it._getLevelsInterval.bind(it);
  it._getLevelsInterval = () => { const r = orig(); r.highestLevel = Math.min(r.highestLevel, it._capLevel ?? 99); r.lowestLevel = Math.min(r.lowestLevel, r.highestLevel); return r; };
}
function setTier(key) {
  tier = key; try { localStorage.setItem(TIER_KEY, key); } catch (e) {}
  document.querySelectorAll('#tiers button').forEach(b => b.classList.toggle('on', b.dataset.k === key));
  viewer?._updatePixelDensityRatio?.();   // 新档位的像素密度上限（变了会自动重设画布）
  const t = TIERS.find(t => t.key === key), base = viewer.world.getItemAt(0);
  if (!base) return;
  const scale = Math.min(1, t.cap / base.source.dimensions.x);   // 相对底图原始宽度；叠加层按同比例
  for (let i = 0; i < viewer.world.getItemCount(); i++) {
    const it = viewer.world.getItemAt(i); capLevels(it);
    it._capLevel = Math.min(it.source.maxLevel, Math.ceil(Math.log2(it.source.dimensions.x * scale)));
    it.minPixelRatio = t.ratio; it._needsUpdate = true; it._needsDraw = true;
  }
  viewer.forceRedraw();
  // 切档后如果没有新瓦片要拉（降档或已缓存），也给一个明确的「已加载」
  const ts = $('#tierState'); ts.textContent = '切换中…'; ts.className = 'busy';
  setTimeout(() => { let busy = 0; for (let i = 0; i < viewer.world.getItemCount(); i++) busy += viewer.world.getItemAt(i)._tilesLoading || 0;
    if (!busy && ts.textContent === '切换中…') { ts.textContent = '✓ 已加载'; ts.className = 'ok'; setTimeout(() => { if (ts.className === 'ok') { ts.textContent = ''; ts.className = ''; } }, 2500); } }, 900);
  $('#status').textContent = `${REG.maps[cur].title} · 清晰度上限 ${Math.min(t.cap, base.source.dimensions.x)}px`;
}
function onOpen() {
  const it = viewer.world.getItemAt(0), sz = it.getContentSize(); aspect = sz.y / sz.x;
  setTier(tier); applyZoomLimit(); viewer.clearOverlays();
  if (REG.maps[cur].kind === 'world') worldOverlays(); else pointOverlays();
  applyOverlayToggle(); markHere($('#here').value); focusStart(true);
  if (pendingFocus) { const el = [...document.querySelectorAll('.mk')].find(e => e.dataset.name === REG.maps[cur].markers?.[pendingFocus]?.name);
    pendingFocus = null; el?._open(); }
}
function applyOverlayToggle() {
  const on = $('#tgBorders').checked, m = REG.maps[cur];
  if (m?.overlay?.type === 'dzi') viewer.world.getItemAt(1)?.setOpacity(on ? 1 : 0);
  document.querySelectorAll('.barriers').forEach(e => e.style.visibility = on ? '' : 'hidden');
}

// ---------------- 标记 ----------------
function placeN(el, nx, ny, placement = OpenSeadragon.Placement.TOP_LEFT) {
  viewer.addOverlay({ element: el, location: new OpenSeadragon.Point(nx, ny * aspect), placement });
}
function place(el, x, y, placement) { const [nx, ny] = toImg(x, y); placeN(el, nx, ny, placement); }
function markerEl({ name, sub, cls = '', tag = 'set', src, extra = '', alias }) {
  const el = document.createElement('div'); el.className = 'mk ' + cls + (tag === 'inf' ? ' inf' : '');
  el.innerHTML = `<div class="lab">${esc(name)}${sub ? '<small> · ' + esc(sub) + '</small>' : ''}</div><div class="pin"></div>`;
  el.dataset.name = name; if (alias) el.dataset.alias = alias.join('|');
  el._open = () => showCard(el, name, tag, src, extra);
  new OpenSeadragon.MouseTracker({ element: el, clickHandler: el._open });
  return el;
}
function marker(o) { const el = markerEl(o); place(el, o.x, o.y); return el; }
function showCard(el, name, tag, src, extra) {
  document.querySelectorAll('.mk.active').forEach(e => e.classList.remove('active')); el && el.classList.add('active');
  const c = $('#card'); c.hidden = false;
  c.querySelector('.tag').textContent = tag === 'inf' ? '推断' : '设定原文'; c.querySelector('.tag').className = 'tag' + (tag === 'inf' ? ' inf' : '');
  c.querySelector('h2').textContent = name; c.querySelector('.src').textContent = src; c.querySelector('.extra').innerHTML = extra || '';
}
function closeCard() { $('#card').hidden = true; document.querySelectorAll('.mk.active').forEach(e => e.classList.remove('active')); }
function worldOverlays() {
  for (const r of M.realms) { const el = document.createElement('div'); el.className = 'realm ' + r.id;
    el.innerHTML = `<b>${r.name}</b><span>${r.sub}</span>`;
    new OpenSeadragon.MouseTracker({ element: el, clickHandler: () => showCard(null, r.name, r.tag, r.src) });
    const off = { oren: -95, fed: -150, xl: -110 }[r.id]; place(el, r.c[0], r.c[1] + off, OpenSeadragon.Placement.CENTER); }
  for (const m of M.minors) { if (m.n < 600) continue; const el = document.createElement('div'); el.className = 'minor'; el.textContent = '中小国';
    place(el, m.c[0], m.c[1], OpenSeadragon.Placement.CENTER); }
  { const el = document.createElement('div'); el.className = 'realm'; el.innerHTML = '<b style="font-size:20px;letter-spacing:6px">海外诸地</b><span>稀有矿物 · 异域人员输出地</span>';
    new OpenSeadragon.MouseTracker({ element: el, clickHandler: () => showCard(null, '海外诸地', 'inf', '货币与贸易：天城输入稀有矿物、异域特殊体质人员（部分来自海外）；陆块形状与位置为推断') });
    place(el, M.overseas[0], M.overseas[1], OpenSeadragon.Placement.CENTER); }
  const enter = id => { const g = REG.groups.tiancheng; return `<p>${g.layers.map(k => { const L = REG.maps[k];
    return L.status === 'planned' ? `<span style="opacity:.5">${esc(L.layer.name)}（制作中）</span>` : `<a data-go="${k}">进入${esc(L.layer.name)} →</a>`; }).join(' · ')}</p>`; };
  for (const p of M.places) {
    if (p.type === 'capital') marker({ name: p.name, sub: p.sub, cls: 'capital' + (p.id === 'tiancheng' ? ' drill' : ''), tag: p.tag, src: p.src, x: p.x, y: p.y,
      extra: p.id === 'tiancheng' ? enter() : '' });
    else marker({ name: p.name, sub: p.sub, cls: 'start', tag: p.tag, src: p.src, x: p.x, y: p.y });
  }
  for (const f of M.fiefs) marker({ name: f.name, tag: f.tag, src: f.src, x: f.x, y: f.y });
}
// 渲染脚本导出的点位地图（天城各层）：标记 + 结界圈（或别的地图的岛屿轮廓，如中层的「上层投影」）
function pointOverlays() {
  const m = REG.maps[cur], d = curData || { markers: [], islands: [] }, od = ovData || {};
  if (m.overlay?.type === 'barriers' && od.islands?.length) {
    const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg'), VW = 1000, VH = 1000 * aspect;
    svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`); svg.setAttribute('preserveAspectRatio', 'none'); svg.classList.add('barriers');
    if (m.overlay.from) svg.classList.add('proj');
    for (const i of od.islands) { const e = document.createElementNS(ns, 'ellipse');
      e.setAttribute('cx', i.nx * VW); e.setAttribute('cy', i.ny * VH); e.setAttribute('rx', i.rx * VW * 1.08); e.setAttribute('ry', i.ry * VH * 1.08);
      e.setAttribute('transform', `rotate(${-i.rot * 180 / Math.PI} ${i.nx * VW} ${i.ny * VH})`);
      if (i.id === 'eden') e.classList.add('eden');
      svg.appendChild(e); }
    svg.style.pointerEvents = 'none';
    viewer.addOverlay({ element: svg, location: new OpenSeadragon.Rect(0, 0, 1, aspect) });
  }
  // link：跨层通道（如中层检查点 ↔ 下层 7 号井），地点卡里给一个直达链接
  const linkHtml = l => l && REG.maps[l.map] && REG.maps[l.map].status !== 'planned'
    ? `<p><a data-go="${esc(l.map)}" data-focus="${esc(l.marker || '')}">${esc(l.label || '前往' + REG.maps[l.map].title)} →</a></p>` : '';
  for (const k of d.markers || []) { const meta = m.markers?.[k.id]; if (!meta) continue;
    placeN(markerEl({ ...meta, sub: (meta.sub || '').replace('{{user}}', '你'), extra: linkHtml(meta.link) }), k.nx, k.ny); }
}

// ---------------- 初始视角与当前地点 ----------------
let userMoved = false;
// 地图的实际尺度（maps.json 的 view.extent_m）：米 → 占图宽的比例
const viewNorm = (m, key) => { const v = m.view; return v?.[key] && v.extent_m?.[0] ? v[key] / v.extent_m[0] : null; };
// 最大放大：按 view.min_width_m（最大放大时还能看见多宽）；没有 view 的图沿用全局的 maxZoomPixelRatio
function applyZoomLimit() { const mw = viewNorm(REG.maps[cur], 'min_width_m'); viewer.viewport.maxZoomLevel = mw ? 1 / mw : null; }
function focusStart(immediately) {
  if (userMoved || !viewer || !viewer.world.getItemCount()) return;
  const m = REG.maps[cur], cs = viewer.viewport.getContainerSize();
  let nx, ny, w;
  if (m.kind === 'world') {
    const el = document.querySelector('.mk.here') || [...document.querySelectorAll('.mk')].find(e => e.dataset.name === '天城');
    const p = el && M.places.find(q => q.name === el.dataset.name) || M.fiefs.find(q => q.name === el?.dataset.name) || M.places.find(q => q.id === m.view?.focus) || M.places[0];
    [nx, ny] = toImg(p.x, p.y); w = .34;
  } else {
    const here = document.querySelector('.mk.here')?.dataset.name, mk = curData?.markers || [];
    const id = pendingFocus || Object.entries(m.markers || {}).find(([, v]) => v.name === here)?.[0] || m.view?.focus || m.focus;
    const k = mk.find(q => q.id === id) || { nx: .5, ny: .5 }; nx = k.nx; ny = k.ny; w = .3;
  }
  // view：初始可见宽度按米给（每张图自己的尺度）；竖屏时让可见「高度」等于这个宽度，手机上不会一打开就缩得很小
  const vw = viewNorm(m, 'width_m');
  if (vw) w = cs.y > cs.x ? vw * cs.x / cs.y : vw;
  w = Math.min(w, aspect * .8 * cs.x / cs.y); const h = w * cs.y / cs.x;   // 竖屏时按高度收窄，避免视框比地图还高
  viewer.viewport.fitBounds(new OpenSeadragon.Rect(nx - w / 2, ny * aspect - h / 2, w, h), immediately);
}
// 当前地点高亮（由 MVU 变量「世界.当前地点」驱动）；世界图上，庄园与天城内部的地点都归到「天城」
const ALIAS = { '天城': ['天城', '伊甸', '庄园', '书房', '主卧', '大厅', '餐厅', '会客厅', '客房', '寝', '浴室', '后庭', '前庭', '上层', '中层', '下层', '钢铁霓虹', '地基', '公寓', '银冠堡'] };
function markHere(v) {
  v = (v || '').replace('{{user}}', '');
  document.querySelectorAll('.mk').forEach(e => { const n = e.dataset.name, al = e.dataset.alias ? e.dataset.alias.split('|') : ALIAS[n] || [];
    const hit = !!v && (v.includes(n) || n.includes(v) || al.some(k => v.includes(k)));
    e.classList.toggle('here', hit); });
}
// 嵌入酒馆（悬浮按钮面板）的消息接口：
//   酒馆 → 地图：eden-map:here {value}（当前地点）、eden-map:open {map}（直接打开某张地图）
//   地图 → 酒馆：eden-map:ready（可以撤掉加载遮罩）、eden-map:state {map, title}（当前地图，用于面板标题）
if (window.top !== window) {
  document.body.classList.add('embed');
  window.addEventListener('message', e => {
    if (e.data?.type === 'eden-map:here') { $('#here').value = e.data.value || ''; markHere(e.data.value); focusStart(false); }
    if (e.data?.type === 'eden-map:open') go(e.data.map);
    // 面板关闭时休眠：关掉底图（释放已解码的瓦片），脚本与数据留着；再打开时唤醒，重新打开当前地图
    if (e.data?.type === 'eden-map:sleep' && viewer) { sleeping = cur; cur = null; viewer.close(); viewer.clearOverlays(); setTimeout(() => { if (sleeping) slowWarmAlt(); }, 3000); }
    if (e.data?.type === 'eden-map:wake' && sleeping) { slowStop = true; const id = sleeping; sleeping = null; go(id); }
  });
}
main();
</script>
