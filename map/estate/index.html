<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D</title>
<!--
  三维室内查看器（three.js 0.160）：整岛 / 场地外观（烘焙光照 glb）+ 分层房间（外观 / 内透 / 剖切）。
  入口：map/estate/index.html；脚本：main.js；模型、房间表、室外热点、房间叫法：由清单（?manifest 或 window.__sceneManifest，缺省同目录 model/manifest.json）给出；
  建筑名、楼层名与房间类别的颜色 / 名字也在清单里（docs/kernel-schema.md K-R104、K-R131、K-R132）。

  ── 嵌入协议（查看器 map/viewer.html 用 fetch + <base href> + blob iframe 加载本页；直接 iframe src 也可以）──
  壳模式（S7-3）：查看器注入 window.__shell = 'host'：本页只画画布、画布里的标注与人物头像；视图分段、楼层条、缩放、房间卡、抽屉都是查看器的。
  独立打开（没有查看器）：自带视图分段、楼层条、控制列、房间卡与抽屉。
  URL 参数：?embed=1 背景透明（blob / srcdoc 载入时自动视为嵌入）；?lang=en；?theme=light|dark；?floor=ext|xray|<楼层 id>；?stats=1 显示帧率 / draw call
  ?tier=low|std 固定模型档（省略则自动：手机 / 省流 / 内存 ≤ 4 GB / 地图「省流」档 → low）
  父 → 本页（window.postMessage；登记在 core/protocol.mjs）：
    { type: 'estate:room',  name, card? }  按房间名 / 别名 / 区域名切到所在楼层（或外观）、高亮并拉近；card = { name, floor, poly } 时取同层同名、多边形最近的那一间
    { type: 'estate:select', node }        （壳模式）选中并拉近这个节点的房间
    { type: 'estate:floor', floor }        'ext' | 'xray' | 楼层 id（也接受 '外观' / '内透' / '1F' / 'B1F' 这类写法）
    { type: 'estate:view',  mode }         'ext' | 'xray' | 'sect'：视图（sect = 最近一次的楼层剖切）
    { type: 'estate:cam',   op }           'in' | 'out' | 'reset'：工具栏的缩放与复位；{ type: 'estate:labels', on } 标注开关
    { type: 'estate:people', items }       { name, room（节点 id）, floor, color, avatar?, dim? }：聊天里位置落在这座楼里的人（头像）；按日程站位的人另走 estate:routine
    { type: 'estate:inset', left } · estate:lang · estate:theme · estate:camera · estate:quality · estate:fps · estate:children · estate:media · estate:stash · estate:taken · estate:routine · estate:pause / resume / dispose
  本页 → 父：
    { type: 'estate:ready', floors: [{ id, label }], rooms: [{ name, node, floor, kind, area }], building: { title, subtitle, summary }, kinds: [{ id, label, color }] }   第一帧画完
    { type: 'estate:select', name, floor, node?, room?, zone?, car? }   用户点选了某个房间 / 区域 / 载具（room = { name, floor, kind, area, note }，查看器据此开共用的地点卡）
    { type: 'estate:person', name }        点了一个人物头像（查看器开人物卡）
    { type: 'estate:view', mode } · { type: 'estate:floor', floor }   用户在页内（独立打开时）换了视图 / 楼层
    { type: 'estate:esc' }                 壳模式里按了 Esc（查看器关最上面一层）；{ type: 'estate:key', key } 独立嵌入时 PageUp / PageDown / [ / ] 交给查看器切层
  调试：window.__estate（setMode / focus / find / focusCard / stats / people / labels）
  依赖：three@0.160.0 在 vendor/（importmap 用相对路径，<base href> 嵌入时同样可用）；GLTFLoader + meshopt 解码器
-->
<link rel="stylesheet" href="../ui/tokens.css">
<script defer src="../ui/icons.js"></script>
<script defer src="../ui/sheet.js"></script>
<script defer src="../ui/chrome3d.js"></script>
<style>
  /* S7-3 T4: tokens.css is the only palette (fonts, radii, accent, glass); light / dark comes from html.light, set with data-theme by main.js */
  :root { --inset: var(--edge); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; color: var(--ink); font: var(--fs-control)/1.45 var(--font-ui); -webkit-font-smoothing: antialiased; overscroll-behavior: none; touch-action: none; }
  #app { position: fixed; inset: 0; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #app canvas { display: block; outline: none; }
  #labels { position: absolute; inset: 0; pointer-events: none; }
  .lbl { pointer-events: none; }
  .lbl span { display: inline-block; padding: var(--sp-1) var(--sp-4); border-radius: var(--r-s); background: var(--map-label-bg); color: var(--map-label-ink); font: 500 var(--fs-small)/1.35 var(--font-ui); letter-spacing: .04em; white-space: nowrap; border: 1px solid var(--map-label-line); transition: opacity var(--dur-2); }
  .lbl.area span { letter-spacing: .08em; }
  .lbl.floor span { background: var(--glass-2); color: var(--accent); letter-spacing: .12em; border-color: var(--glass-line); }
  .lbl.hide span { opacity: 0; }
  .lbl.occl { display: none; }
  .lbl.hot span { border-color: var(--accent); color: var(--accent); background: var(--glass-2); opacity: 1; }
  body.nolabels .lbl:not(.hot) span { display: none; }
  #floors { display: flex; gap: var(--sp-1); }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); letter-spacing: .2em; font-size: var(--fs-small); transition: opacity var(--dur-3); pointer-events: none; }
  #loading.done { opacity: 0; }
  #loading .fail { pointer-events: auto; display: grid; gap: var(--sp-4); place-items: center; color: var(--ink); letter-spacing: .12em; }
  #loading .fail button, .acts button { all: unset; box-sizing: border-box; cursor: pointer; min-height: 32px; padding: var(--sp-2) var(--sp-5); border: 1px solid var(--accent); border-radius: var(--r-pill); color: var(--accent); font-size: var(--fs-small); letter-spacing: .1em; display: inline-flex; align-items: center; }
  .acts button:hover { background: var(--accent); color: var(--on-accent); }
  #loading .fail button:focus-visible, .acts button:focus-visible, .pc:focus-visible i { outline: none; box-shadow: var(--focus-ring); }
  body:not(.embed) { background: radial-gradient(120% 95% at 50% 32%, color-mix(in srgb, var(--bg) 85%, #fff), var(--bg) 58%, color-mix(in srgb, var(--bg) 70%, #000)); }
  #vignette { position: fixed; inset: 0; pointer-events: none; display: none; background: radial-gradient(130% 100% at 50% 45%, transparent 58%, color-mix(in srgb, var(--bg) 40%, transparent) 100%); }
  #grade { position: fixed; inset: 0; pointer-events: none; display: none; mix-blend-mode: soft-light; background: linear-gradient(180deg, rgba(255,214,150,.20), rgba(255,190,120,.10) 55%, rgba(40,70,70,.10)); }
  body:not(.embed) #vignette, body:not(.embed).grade #grade { display: block; }
  html.noblur *, html.noblur *::before { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  #stats { position: absolute; right: 56px; bottom: var(--sp-6); font: var(--fs-micro)/1.4 var(--font-mono); color: var(--muted); background: var(--glass-2); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-s); white-space: pre; display: none; }
  /* the room card (standalone page only: inside the viewer the card is the viewer's) and the one small hover label */
  #card { padding: var(--sp-2) var(--sp-4); }
  #card h3 { margin: 0 0 var(--sp-1); font: 600 var(--fs-title)/1.3 var(--font-ui); letter-spacing: .06em; }
  #card .sub { font-size: var(--fs-small); color: var(--muted); margin-bottom: var(--sp-3); }
  #card .row { font-size: var(--fs-control); margin: var(--sp-1) 0; }
  #card .row em { font-style: normal; color: var(--muted); margin-right: var(--sp-3); }
  #card .acts { display: flex; gap: var(--sp-4); margin-top: var(--sp-4); }
  #cardEmpty { color: var(--muted); font-size: var(--fs-small); padding: var(--sp-5) var(--sp-4); margin: 0; display: none; }
  #card:empty + #cardEmpty { display: block; }
  .kc { display: inline-block; width: 12px; height: 12px; border-radius: var(--r-s); background: var(--kc); margin-right: var(--sp-3); vertical-align: -1px; border: 1px solid var(--glass-line); }
  #tip { position: absolute; z-index: var(--zl-3); pointer-events: none; max-width: 270px; padding: var(--sp-2) var(--sp-4); border-radius: var(--r-m); font: 600 var(--fs-control)/1.3 var(--font-ui); letter-spacing: .04em; opacity: 0; transition: opacity var(--dur-1); white-space: nowrap; }
  #tip.on { opacity: 1; }
  /* colour key of the section view: one chip per room kind on the shown storey */
  #kinds { position: absolute; left: var(--sp-5); bottom: calc(var(--sheet-h, 0px) + var(--sp-5)); display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); max-width: min(560px, calc(100% - 2 * var(--sp-5))); padding: var(--sp-3) var(--sp-5); border-radius: var(--r-m); font: 500 var(--fs-small)/1.2 var(--font-ui); pointer-events: none; z-index: var(--zl-2); }
  body.shell #kinds { bottom: auto; top: var(--sp-5); }
  #kinds[hidden] { display: none; }
  #kinds span { display: inline-flex; align-items: center; white-space: nowrap; }
  #about { padding: var(--sp-3) var(--sp-4); } #about h2 { margin: 0; font: 600 var(--fs-title)/1.3 var(--font-ui); letter-spacing: .12em; }
  #about .motto { color: var(--accent); letter-spacing: .08em; font-size: var(--fs-small); margin: var(--sp-2) 0; } #about p { margin: var(--sp-2) 0; color: var(--muted); font-size: var(--fs-small); }
  /* presence chips (S7-3 T8): a 32 px disc in a 44 px hit area; more than three people in a room fold into one +n chip that opens the list */
  .pc { pointer-events: auto; position: relative; display: grid; place-items: center; width: var(--hit); height: var(--hit); padding: 0; border: 0; background: transparent; cursor: pointer; font: inherit; color: inherit; }
  .pc i { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; overflow: hidden; background: var(--c, var(--surface-2)); border: 2px solid var(--ink); font: 600 var(--fs-control)/1 var(--font-ui); font-style: normal; color: #fff; box-shadow: var(--elev-float); }
  .pc i img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pc.dim i { opacity: .62; border-style: dashed; }
  .pc.more i { background: var(--surface); color: var(--ink); }
  .pc b { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: calc(-1 * var(--sp-2)); padding: var(--sp-1) var(--sp-4); border-radius: var(--r-pill); background: var(--map-label-bg); color: var(--map-label-ink); border: 1px solid var(--map-label-line); font: 500 var(--fs-micro)/1.4 var(--font-ui); white-space: nowrap; display: none; pointer-events: none; }
  .pc:hover b, .pc:focus-visible b, .pc.on b { display: block; }
  #more { position: absolute; z-index: var(--zl-3); min-width: 160px; max-width: 260px; padding: var(--sp-2); border-radius: var(--r-m); }
  #more[hidden] { display: none; }
  #more button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: var(--sp-4); width: 100%; min-height: var(--hit); padding: 0 var(--sp-4); border-radius: var(--r-s); cursor: pointer; font-size: var(--fs-control); }
  #more button:hover { background: var(--surface-2); } #more button:focus-visible { box-shadow: var(--focus-ring); }
  #more button i { width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--c); color: #fff; font: 600 var(--fs-micro)/1 var(--font-ui); font-style: normal; }
  body.shell #app canvas { outline: none; }
</style>
</head>
<body>
<div id="app"><div id="labels"></div></div>
<div id="vignette"></div><div id="grade"></div>
<nav id="floors"></nav>
<div id="card"></div><div id="tip" class="g1" aria-hidden="true"></div>
<div id="stats"></div>
<div id="loading"><span>Loading…</span></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }
</script>
<link rel="modulepreload" href="./vendor/three.module.min.js">
<link rel="modulepreload" href="./vendor/jsm/controls/OrbitControls.js">
<link rel="modulepreload" href="./vendor/jsm/renderers/CSS2DRenderer.js">
<link rel="modulepreload" href="./vendor/jsm/loaders/GLTFLoader.js">
<link rel="modulepreload" href="./vendor/jsm/libs/meshopt_decoder.module.js">
<link rel="modulepreload" href="./main.js">
<link rel="preload" href="./model/manifest.json" as="fetch" crossorigin>
<script>
  // 加载看门狗：8 s 内没有首帧，或首帧前出错 → 「加载失败 · 重试」
  (function () {
    var en = /[?&]lang=en\b/.test(location.search), shown = false;
    function fail(why) {
      if (window.__estateFirstFrame || shown) return; shown = true;
      var el = document.getElementById('loading'); if (!el) return;
      el.classList.remove('done');
      el.innerHTML = '<div class="fail"><span>' + (en ? 'Failed to load' : '加载失败') + '</span><button type="button">' + (en ? 'Retry' : '重试') + '</button></div>';
      el.querySelector('button').onclick = function () { location.reload(); };
      if (why) console.warn('estate load:', why);
      if (parent !== window) try { parent.postMessage({ type: 'estate:fail', reason: String(why) }, '*'); } catch (e) {}
    }
    window.__estateFail = fail;
    var t = setTimeout(function () { fail('timeout'); }, 8000);
    window.__estateWatchdog = function () { clearTimeout(t); };
    // 模块开始跑以后，每个构建阶段重新计 8 s：慢手机不会误报失败
    window.__estateKick = function () { if (window.__estateFirstFrame || shown) return; clearTimeout(t); t = setTimeout(function () { fail('timeout'); }, 8000); };
    addEventListener('error', function (e) { fail(e && (e.message || (e.target && e.target.src))); }, true);
    addEventListener('unhandledrejection', function (e) { fail(e && e.reason); });
  })();
</script>
<script type="module" src="./main.js" onerror="window.__estateFail && window.__estateFail('main.js')"></script>
</body>
</html>
