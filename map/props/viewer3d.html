<!--
  通用三维查看器：viewer3d.html?model=<id> 读 <id>/manifest.json（Estate3D Manifest 标准契约，map/core/scene3d-manifest.mjs：
  glb 地址 / 档位兜底 / 热点 / 网格分组 / 相机都来自清单，代码不写死模型路径；model id 只来自数据）。
  渲染：随仓库的 three（../estate/vendor/），烘焙光照 → MeshBasicMaterial，无灯光、无阴影、无后处理。
  嵌入（viewer.html 的 kind=estate + viewer3d 字段）：blob iframe，<base> 指向本目录；模型 id 由注入的 window.__modelId 给。
  消息（与旧庄园页同一套）：
    宿主 → 本页：estate:lang {lang} / estate:theme {theme} / estate:quality {q} / estate:inset {left} / v3d:fly {hotspot}
    本页 → 宿主：estate:ready（界面就绪，模型自己显示进度）/ estate:fail {reason} / v3d:state {mode, hotspot, flows}
    宿主 → 本页（续）：v3d:flows {on}（流向模式：manifest.flows 的示意折线 + 沿线移动的小球）
  调试：window.__viewer3dProbe（stats、setMode、fly、orbitBench）。?tier=low|high 强制档位，?lang=en。
-->

  @media (max-width: 640px) {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';   // Part 3 §5：KTX2 / Basis 备选贴图（用不上就退回 WebP）
import { mountProgress } from '../ui/progress.mjs';   // fix3：统一加载进度组件
import { Estate3D } from '../core/scene3d-manifest.mjs';   // Estate3D Manifest 标准契约（P3-A）：glb 地址与档位兜底都走清单，代码不写死模型路径
import { nsKey } from '../core/pack.mjs';   // 通用化 v1：本机键按包换前缀（edenMapLang / 画质 / 提示卡……），与查看器同一规则
import { createRenderGate, wireVisibility } from '../core/render-gate.mjs';   // Part 7-4：页面隐藏时渲染循环整个停掉
// Part 3：共享三维运行时（上下文 / 剔除 / LOD / 实例化 / 贴图预算）——全仓只有 render-context.mjs 里 new WebGLRenderer
import { createRenderer as createGpu, governor as createGovernor, pickDpr } from 'engine3d/render-context.mjs';
import { prepare as prepareCulling } from 'engine3d/culling.mjs';
import { createLodController } from 'engine3d/lod-controller.mjs';
import { batch as batchInstances, writeMatrices } from 'engine3d/instancing.mjs';
import { createTexRes } from 'engine3d/texres.mjs';
import * as GB from '../core/graphics-budget.mjs';   // Part 3 §1：显存预算的纯策略（估算 / 水位 / 淘汰顺序）
import { makePresetCluster, makeCompass, makeHintCard, makeIdleTimer, prefersReducedMotion } from '../ui/camera-controls.js';   // 相机控制共用小件（预设/指北针/提示卡/空闲计时），与庄园页共用

const Q = new URLSearchParams(location.search);
const MODEL = window.__modelId || Q.get('model');   // 资产 id 只来自数据（maps.json 的 viewer3d 字段 / ?model=），不再内置默认模型
const EMBED = window.top !== window;
const $ = s => document.querySelector(s);
let dirty = true;
const post = m => { if (EMBED) try { parent.postMessage(m, '*'); } catch (e) {} };

// ---------------- UI v2 外壳（ui/chrome3d.js）：视图分段 + 剖切高度二级条 + 控制列 + 唯一抽屉（部件 · 流向 · 说明）----------------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PID = window.__packId || 'eden';   // 宿主查看器注入（app/subpage3d-host.mjs）；单独打开默认 eden
const NKEY = k => nsKey(k, PID);
const LSg = k => { try { return localStorage.getItem(NKEY(k)); } catch (e) { return null; } };
// 调试：显示帧率——本页多数时候是 blob: 载入的子 iframe，跟宿主不同源，读不到宿主 localStorage；开关靠宿主 estate:fps 消息（同源直开时 LSg 兜底）
let FPS_ON = Q.has('fps') || LSg('edenMapFps') === '1';
const C = UI3D.create({ embed: EMBED, views: [{ id: 'ext', label: '外观' }, { id: 'xray', label: '内透' }, { id: 'cut', label: '剖切' }], view: 'ext', onView: m => setMode(m), sub: document.getElementById('cut'),
  tabs: [{ id: 'parts', btnClass: 'partsTab', panel: document.getElementById('list') }, { id: 'flows', btnClass: 'flowsTab', panel: document.getElementById('flows') }, { id: 'info', btnClass: 'infoTab', panel: document.getElementById('info') }],
  controls: [{ id: 'zin', icon: 'in', onClick: () => dolly(1 / 1.4) }, { id: 'zout', icon: 'out', onClick: () => dolly(1.4) }, { id: 'zreset', icon: 'reset', onClick: () => { select(null); camTouched = false; frameStart(); } },
    { id: 'pinBtn', icon: 'label', pressed: true, onClick: () => setPins(document.body.classList.contains('nopins')) }],
  onEsc: () => post({ type: 'estate:key', key: 'Escape' }) });
C.sheet.showTab('flows', false);
C.setAuto(LSg('edenMap3dAuto') === '1');
let lastIns = '';
C.onInsets(i => { const k = i.bottom + ',' + i.right; if (k === lastIns) return; lastIns = k; camera.setViewOffset(innerWidth, innerHeight, i.right / 2, i.bottom / 2, innerWidth, innerHeight); camera.updateProjectionMatrix(); dirty = true; });   // 只换取景偏移，不重分配画布
let flowTabOn = false;
new MutationObserver(() => { const on = C.sheet.tab === 'flows' && C.sheet.open; if (on !== flowTabOn) { flowTabOn = on; if (!flowPin) setFlows(on); } }).observe(C.sheet.el, { attributes: true, attributeFilter: ['data-state', 'data-tab'], subtree: true });
function dolly(f) { const d = camera.position.clone().sub(controls.target).multiplyScalar(f); if (d.length() < controls.minDistance || d.length() > controls.maxDistance) return; camera.position.copy(controls.target).add(d); controls.update(); camTouched = true; dirty = true; }
function setPins(on) { document.body.classList.toggle('nopins', !on); C.control('pinBtn')?.setAttribute('aria-pressed', String(on)); }
addEventListener('keydown', e => { if ((e.key === 'l' || e.key === 'L') && !e.ctrlKey && !e.metaKey && !e.target.closest?.('input,textarea') && LSg('edenMapKeys') === '1') setPins(document.body.classList.contains('nopins')); });
function chromeLang() {
  C.setViews([{ id: 'ext', label: t('mode_ext') }, { id: 'xray', label: t('mode_xray') }, { id: 'cut', label: t('mode_cut') }]); C.setView(mode);
  C.setText({ expand: t('expand'), collapse: t('collapse'), region: t('region') }); C.seg.setAttribute('aria-label', t('modes'));
  C.sheet.label('info', esc(t('info')), esc(t('info').slice(0, 1)));
  if (!HS.length) C.sheet.label('parts', esc(t('parts')), esc(t('parts').slice(0, 1)));
  for (const [id, k] of [['zin', 'zin'], ['zout', 'zout'], ['zreset', 'reset'], ['pinBtn', 'pins']]) { const b = C.control(id); if (b) { b.title = t(k); b.setAttribute('aria-label', t(k)); } }
  if (MAN) C.setTitle(cleanTitle(L(MAN.title)));
}
// ---------------- 语言 / 主题 ----------------
const STR = {
  zh: { mode_ext: '外观', mode_xray: '内透', mode_cut: '剖切', cut_h: '剖切高度', parts: '部件', parts_h: '部件（点击飞过去）', flows: '流向', legend: '图例', flows_h: '流向（示意，点一条看说明）', flow_pin: '固定显示', info: '说明', info_empty: '点模型上的编号或「部件」列表里的一项，这里显示说明', expand: '展开', collapse: '收起', zin: '放大', zout: '缩小', reset: '复位视野', pins: '显示标注（热点编号，L）', region: '部件、流向与说明', retry: '重试', close: '关闭',
    loading: '加载模型 {p}', fail: '模型加载失败，请检查网络后重试', slow: '加载较慢…可以继续等，或重试', modes: '显示方式', canvas: '三维模型：拖动旋转，双指缩放',
    preset_top: '俯视', preset_iso: '斜视 45°', preset_front: '正面', preset_free: '自由' },
  en: { mode_ext: 'Exterior', mode_xray: 'X-ray', mode_cut: 'Section', cut_h: 'Cut height', parts: 'Parts', parts_h: 'Parts (tap to fly)', flows: 'Flows', legend: 'Legend', flows_h: 'Flows (schematic, tap for details)', flow_pin: 'Keep shown', info: 'Details', info_empty: 'Tap a number on the model or an item under Parts to see details here', expand: 'Expand', collapse: 'Collapse', zin: 'Zoom in', zout: 'Zoom out', reset: 'Reset view', pins: 'Show labels (hotspot numbers, L)', region: 'Parts, flows and details', retry: 'Retry', close: 'Close',
    loading: 'Loading model {p}', fail: 'Model failed to load. Check the connection and retry.', slow: 'Still loading… keep waiting or retry', modes: 'View mode', canvas: '3D model: drag to orbit, pinch to zoom',
    preset_top: 'Top', preset_iso: 'Isometric 45°', preset_front: 'Front', preset_free: 'Free' },
};
// v0.9.6：语言先看地图的设置（同源本机存储 edenMapLang；通用化 v1 起按包前缀读，别的包不再退回中文），再看系统语言；嵌入时查看器还会发 estate:lang
let LANG = (Q.get('lang') || LSg('edenMapLang') || 'zh').startsWith('en') ? 'en' : 'zh';
// 色觉模式（E7，宿主经 estate:cvd 转发查看器「设置 → 显示 → 色觉模式」）：0 关 / rg 红绿 / by 蓝黄。
// manifest.flows 的颜色各建筑各写，这里不改每个 manifest，改用「按原色相桶归到色觉安全色板」的通用重映射，流向图例本来就有文字名（第二线索）
let CVD = '0';
const CVD_PAL = { rg: ['#e69f00', '#56b4e9', '#0072b2', '#009e73', '#cc79a7', '#f0e442', '#994455', '#d55e00'], by: ['#d7263d', '#9ad0f5', '#029e73', '#7a5195', '#e2903a', '#cc79a7', '#0072b2', '#994455'] };
function cvdColor(hex) {   // K-R64 / I-09：只收 #rrggbb，别的一律白色（关色觉模式时也一样），这个值会进 style 与 THREE.Color；与 app/color-vision-mode.mjs hueBucket 同一算法
  if (!/^#[0-9a-f]{6}$/i.test(hex || '')) return '#ffffff'; if (CVD === '0') return hex;
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = !d ? 0 : mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h = (h * 60 + 360) % 360;
  const pal = CVD_PAL[CVD] || CVD_PAL.rg; return pal[Math.floor(h / (360 / pal.length)) % pal.length];
}
// 包内文案（manifest.strings，宿主注入 window.__packStrings，通用化 v1）：键 = 本页 STR 的键，英文变体「键@en」；没配的键走本页字典
const PS = window.__packStrings || null;
const t = (k, v = {}) => ((PS && (LANG === 'en' ? PS[k + '@en'] ?? PS[k] : PS[k])) || STR[LANG][k] || STR.zh[k] || k).replace(/\{(\w+)\}/g, (_, n) => v[n] ?? '');
const L = o => (o && (o[LANG] || o.zh)) || '';
// 玩家可见标题不带「测试」字样（清单 title 由建模侧维护，这里只在显示时去掉前缀与「模型交互」注记）
const cleanTitle = s => String(s || '').replace(/^(测试[：:]\s*|Test:\s*)/i, '').replace(/\s*[（(](模型交互|model interaction)[）)]\s*$/i, '');
function applyLang() {
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh';
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.dataset.t); });
  document.querySelectorAll('[data-ta]').forEach(e => e.setAttribute('aria-label', t(e.dataset.ta)));
  $('#c').setAttribute('aria-label', t('canvas')); chromeLang();
  if (MAN) { document.title = cleanTitle(L(MAN.title)); $('#credit').textContent = L(MAN.credit); buildList(); if (sel) showCard(sel); }
}
function setTheme(th) { document.documentElement.classList.toggle('light', th === 'light'); if (renderer) { scene.background = new THREE.Color(getComputedStyle(document.body).getPropertyValue('--bg').trim() || '#101418'); dirty = true; } }
document.documentElement.classList.toggle('light', (Q.get('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')) === 'light');

// ---------------- 性能档位 ----------------
const coarse = matchMedia('(pointer: coarse)').matches, small = Math.min(screen.width, screen.height) < 600;
const mem = navigator.deviceMemory || 8;
const TIER = Q.get('tier') || ((coarse && small) || mem <= 4 ? 'low' : 'high');
const DPR_CAP = TIER === 'low' ? 1.25 : coarse ? 2 : (devicePixelRatio || 2);   // 桌面（细指针）不封顶 2 倍，用满物理像素比；手机 / 触屏保持原样（2026-09-28）
// 低档 / 设置「三维画质 · 省电」：不用毛玻璃（Mac 低分辨率模式下 backdrop-filter 每帧重算模糊，v2 门控遗留）
if (TIER === 'low' || LSg('edenMap3dQ') === '1') document.documentElement.classList.add('noblur');   // 同旧庄园 DPR_CAP 思路：高 DPR 手机上像素数 ×4 不值
const MSAA = TIER !== 'low';

// ---------------- 场景 ----------------
const canvas = $('#c');
let renderer, gpu = null;   // gpu = 共享上下文句柄（map/three/render-context.mjs）
// ---------------- Part 3 §5：显存预算（估字节 → 吃紧就按优先级腾）----------------
// 浏览器不给真实显存：这里用「贴图尺寸 + 几何属性」的确定性估算，配 renderer 的自报数，
// 超了高水位就按 未激活 → 远 → 中 的顺序腾；正在看的近档永不淘汰。
let budgetT = 0, lastTileCount = 0;
function budgetTick(now) {
  if (!root || now - budgetT < 1500) return;   // 每 1.5 s 一次就够（遍历场景有成本）
  budgetT = now;
  try {
    const list = texres?.resources(root, { estimateTexture: GB.estimateTexture, estimateGeometry: GB.estimateGeometry,
      kindOf: o => (o.userData?.role === 'props' ? 'mid' : 'mid') }) || [];
    const used = GB.estimateAll({ textures: [], geometries: [], extraBytes: list.reduce((a, r) => a + r.bytes, 0) })

  if (instant || matchMedia('(prefers-reduced-motion: reduce)').matches) { controls.target.copy(to.t); camera.position.copy(to.p); controls.update(); dirty = true; return true; }
  tween = { t0: performance.now(), dur: 900, fp: camera.position.clone(), ft: controls.target.clone(), to };
  return true;
}
function stepTween(now) {
  if (!tween) return;
  const k = Math.min(1, (now - tween.t0) / tween.dur), e = ease(k);
  // 走弧线：中途抬高一点，避免穿墙的观感
  const lift = Math.sin(Math.PI * k) * Math.min(6, tween.fp.distanceTo(tween.to.p) * 0.25);
  camera.position.lerpVectors(tween.fp, tween.to.p, e); camera.position.y += lift;
  controls.target.lerpVectors(tween.ft, tween.to.t, e);
  controls.update(); dirty = true;
  if (k >= 1) tween = null;
}
['pointerdown', 'wheel'].forEach(ev => canvas.addEventListener(ev, () => { tween = null; camTouched = true; }, { passive: true }));
canvas.addEventListener('pointerdown', () => C.dragStart()); addEventListener('pointerup', () => C.dragEnd());

// ---------------- 显示方式 ----------------
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1.6);
const cutY = () => +$('#cutH').value;
function showCut() { $('#cutV').textContent = (+$('#cutH').value).toFixed(1) + ' m'; }
function setCut(y) { $('#cutH').value = y; showCut(); cutPlane.constant = y; dirty = true; }
$('#cutH').addEventListener('input', () => setCut(cutY()));
function setMode(m) {
  mode = m;
  C.setView(m); C.showSub(m === 'cut');
  $('#cut').hidden = m !== 'cut';
  U.uXray.value = m === 'xray' ? 1 : 0;
  if (meshes.__edges) meshes.__edges.children.forEach(l => { l.visible = m === 'xray'; });
  renderer.clippingPlanes = m === 'cut' ? [cutPlane] : [];
  U.uCapOn.value = m === 'cut' ? 1 : 0;
  if (m === 'cut') setCut(cutY());
  dirty = true; post({ type: 'v3d:state', mode, hotspot: sel });
}
// (a) 屋顶自动掀开：外观模式下相机拉近到建筑里 / 附近时屋顶上移淡出；内透 / 剖切直接藏掉
let roofK = 0;
const BLD = new THREE.Box3();
function updateRoof(dt) {
  if (!MAN) return;
  const B = MAN.groups.building; BLD.min.set(...B.min); BLD.max.set(...B.max);
  const d = BLD.distanceToPoint(camera.position), near = BLD.containsPoint(controls.target) && camera.position.distanceTo(controls.target) < 16;
  const want = mode !== 'ext' ? 1 : (near || d < 1.5 ? 1 : 0);
  const k2 = roofK + Math.sign(want - roofK) * Math.min(Math.abs(want - roofK), dt / 350);
  if (k2 === roofK) return; roofK = k2; dirty = true;
  for (const n of MAN.groups.roof || []) { const m = meshes[n]; if (!m) continue;
    m.visible = roofK < 0.999; m.material.userData.u.uFade.value = 1 - roofK;
    m.userData.m0 ??= m.matrix.clone(); m.matrix.copy(m.userData.m0).premultiply(new THREE.Matrix4().makeTranslation(0, roofK * 3, 0)); }
}

// ---------------- 拾取 ----------------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || performance.now() - down.t > 500) return; down = null;
  const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const cand = Object.values(meshes).filter(m => m.isMesh && m.visible && m.userData.role !== 'site' && !(m.userData.role === 'roof' && roofK > 0.5) && !(mode === 'xray' && m.userData.role === 'walls'));
  for (const g of instState.batch?.groups || []) if (g.mesh.visible) cand.push(g.mesh);   // 合批的静态件也要能命中
  if (instState.badge?.visible) cand.push(instState.badge);
  const hits = ray.intersectObjects(cand, false).filter(h => mode !== 'cut' || h.point.y <= cutY());
  const hit = hits[0];
  // 命中合批件 / 徽章：instanceId → 原网格名 / 热点 id
  let hs = hit && HS.find(s => s.m === hit.object);
  if (!hs && hit?.object?.isInstancedMesh && hit.instanceId != null) {
    const id = resolveInstanceId(hit.object, hit.instanceId);
    hs = HS.find(s => s.id === id) || HS.find(s => (s.m?.name || s.m?.uuid) === id);
  }
  if (hs) fly(hs.id); else if (sel) select(null);
});

// ---------------- 循环 ----------------
function resize() { const w = innerWidth, h = innerHeight; if (!w || !h) return; renderer.setSize(w, h, false); camera.aspect = w / h;
  const ins = C.insets(); camera.setViewOffset(w, h, ins.right / 2, ins.bottom / 2, w, h);   // 取景中心让开抽屉 / 右栏
  camera.updateProjectionMatrix(); dirty = true;
  if (root && !camTouched && !tween && !sel) frameStart(); }
addEventListener('resize', resize);
const FT = []; let last = performance.now(), running = true;
// 自适应像素比（2026-09-29 恶性卡顿）：桌面档不封顶 DPR + MSAA + 全部 DoubleSide，大场景（圣山 9MB）整页拖到 3fps。
// 连续渲染的帧距持续 >55ms（<18fps）时像素比降一档（×0.7，下限 1），缓过来不回升（回升要用户在「三维画质」里自己改，避免来回震荡）。
let govT = [], govHold = 0;
function govFrame(dt, now) {   // Part 3 §3：策略搬到共享运行时（map/three/render-context.mjs），这里只负责落地
  const next = gov.sample(dt, now, renderer.getPixelRatio());
  if (next == null) return;
  gpu?.setDpr(next); renderer.setSize(innerWidth, innerHeight);
  stats.dpr = next; stats.dprAdj = (stats.dprAdj || 0) + 1; gov.reset(); dirty = true;
}
function frame(now) {
  if (!running || gate.hidden) return;
  requestAnimationFrame(frame);
  const dt = Math.min(100, now - last); last = now;
  stepTween(now); controls.update(); updateRoof(dt); fadeBackdrop(now);   // 底图背景板的淡出（转场才用得上）
  if (!SITE.isEmpty()) { const c = controls.target, d = c.clone().clamp(SITE.min, SITE.max).sub(c); if (d.lengthSq() > 0) { c.add(d); camera.position.add(d); } }   // 平移不出场地
  if (camera.position.y < 0.3) camera.position.y = 0.3;
  if (sel) { const q = (now / 90) | 0; if (q !== selPulseQ) { selPulseQ = q; U.uTime.value = now / 1000; dirty = true; } }   // 脉冲 11Hz 足够顺滑，重渲频率从满帧率降到 1/5（大模型上这是 GPU 大头）
  if (flowOn) { stepFlows(now); dirty = true; }
  if (mode === 'xray') { const d = camera.position.clone().sub(U.uCenter.value); d.y = 0; if (d.lengthSq() > 1e-6) U.uCamDir.value.copy(d.normalize()); }
  if (FPS_ON) { FT.push(dt); if (FT.length > 600) FT.shift();
    const f = $('#fps'); f.hidden = false; f.textContent = `${(1000 / (FT.slice(-30).reduce((a, b) => a + b, 0) / Math.min(30, FT.length))).toFixed(0)} fps · ${TIER} · dpr ${renderer.getPixelRatio()}`; }
  if (!dirty || !root) return;
  dirty = false;
  renderer.clear();
  if (bdMesh.visible) renderer.render(bdScene, bdCam);   // 底图（转场时才可见）
  renderer.render(scene, camera); placePins();
  govFrame(dt, now);   // 只在真渲染的帧采样帧距：待机（dirty=false）不计
  budgetTick(now);   // Part 3 §5：显存预算（每 1.5 s 一次）
  if (lod && now - lodT > 250) { lodT = now; try { lod.update({ camera, target: controls.target, viewportWidth: innerWidth, viewportHeight: innerHeight }); } catch (e) {} }
}
let lodT = 0;   // LOD 每 250 ms 重算一次就够（镜头移动不会每帧跨档）
// Part 7-4 视口可见性节流：切后台 → 停排帧；回前台 → 若循环还在（没 pagehide）就重启
const gate = createRenderGate({
  onResume: () => { if (running) { last = performance.now(); dirty = true; requestAnimationFrame(frame); } },
});
wireVisibility(gate, document);
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { dirty = true; });
addEventListener('pagehide', () => { running = false; disposeRoot(); gpu ? gpu.dispose() : (renderer.dispose(), renderer.forceContextLoss?.()); });

// ---------------- 宿主消息 ----------------
let bench = null;
addEventListener('message', e => {
  if (e.source !== parent) return;   // 只认嵌入它的查看器（A-6）
  const d = e.data || {};
  if (d.type === 'estate:lang') { LANG = d.lang === 'en' ? 'en' : 'zh'; applyLang(); }
  if (d.type === 'estate:theme') setTheme(d.theme);
  if (d.type === 'estate:quality' && typeof d.q === 'string' && renderer) {   // 设置「三维画质」即时生效（毛玻璃 + 像素比）
    document.documentElement.classList.toggle('noblur', TIER === 'low' || d.q === '1');
    gpu?.setDpr(pickDprFor(d.q)); renderer.setSize(innerWidth, innerHeight); stats.dpr = renderer.getPixelRatio(); gov.reset(); dirty = true; }
  if (d.type === 'estate:inset') { document.body.style.setProperty('--inset', Math.max(0, (d.left | 0) - 8) + 'px'); }
  if (d.type === 'estate:cvd' && typeof d.mode === 'string') { CVD = d.mode; document.documentElement.classList.toggle('cvd', CVD !== '0'); document.documentElement.dataset.cvd = CVD; if (FL.length) buildFlows(); }
  if (d.type === 'estate:pause') running = false;   // 查看器休眠（宿主挂起）：停渲染循环，模型与 GPU 资源留着——与 estate/main.js 同一套；
  // 不接这条的话，blob iframe 只是 visibility:hidden，RAF 照跑：选中热点时每帧满分辨率渲染，把整个酒馆拖到个位数帧率（2026-09-29 恶性卡顿）
  if (d.type === 'estate:resume' && !running) { running = true; last = performance.now(); requestAnimationFrame(frame); dirty = true; }
  if (d.type === 'estate:fps' && typeof d.on === 'boolean') { FPS_ON = d.on; if (!d.on) { $('#fps').hidden = true; $('#fps').textContent = ''; } dirty = true; }
  if (d.type === 'v3d:fly') fly(d.hotspot);
  if (d.type === 'v3d:mode') setMode(d.mode);
  if (d.type === 'v3d:flows') setFlows(!!d.on);
  if (d.type === 'v3d:backdrop') showBackdrop(d.bitmap);   // Part 3 §3：底图快照（转移进来的位图，用完在本页 close）
});

// 调试 / 测量接口
window.__viewer3dProbe = {
  stats, get ft() { return FT.slice(); }, setMode, fly, select, setFlows, showFlow, get flows() { return flowOn; }, get mode() { return mode; }, get ready() { return !!root; }, info: () => renderer.info,
  // Part 3：LOD / 实例化 / 预算的自检面（浏览器探针与设置页诊断用）
  perf: () => ({
    lod: lod?.describe() || null, detail: stats.glb || null,
    instanceGroups: instState.groups, instances: instState.badgeCount, culled: stats.culled || 0,
    draws: renderer.info.render.calls, tris: renderer.info.render.triangles,
    memory: { ...renderer.info.memory }, dpr: renderer.getPixelRatio(),
    gpu: gpu?.stats() || null, texres: texres?.stats?.() || null,
    budget: { ...budget, ...budgetSt },   // 预算档位 + 估算占用 + 是否吃紧 + 淘汰次数
  }),
  // 匀速绕目标转 ms 毫秒，返回帧时间（每帧强制渲染）
  orbitBench(ms = 4000) { return new Promise(res => { const out = []; const t0 = performance.now(); let lt = t0;
    const tick = now => { out.push(now - lt); lt = now; const a = (now - t0) / ms * Math.PI * 2 * 0.5;
      const off = camera.position.clone().sub(controls.target); off.applyAxisAngle(new THREE.Vector3(0, 1, 0), 0.01); camera.position.copy(controls.target).add(off); controls.update(); dirty = true;
      if (now - t0 < ms) requestAnimationFrame(tick); else res(out.slice(2)); };
    requestAnimationFrame(tick); }); },
  home() { tween = null; camera.position.copy(START.p); controls.target.copy(START.t); controls.update(); dirty = true; },
  view(p, tg) { camera.position.set(...p); controls.target.set(...tg); controls.update(); dirty = true; },
  // 测试探针（相机控制回归，U，2026-09-28）：只读，不改变行为
  get camDist() { return camera.position.distanceTo(controls.target); },
  get target() { return controls.target.toArray(); },
};
applyLang();
post({ type: 'estate:ready' });   // 界面已就绪；模型进度在本页自己的加载层里显示（失败有「重试」）
load();
</script>
